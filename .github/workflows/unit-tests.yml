on:
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: run unit tests
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: setup java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: run unit tests
        run: ./mvnw test