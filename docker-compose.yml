services:
  db:
    image: postgres:16

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: costManager

    ports:
      - 5432:5432

    volumes:
      - dev_db:/var/lib/postgresql/data

  app:
      build: .
      ports:
        - 8080:8080
      environment:
        SPRING_DATASOURCE_URL: "jdbc:postgresql://db:5432/costManager"
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}

volumes:
  dev_db:
